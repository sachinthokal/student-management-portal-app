spring.application.name=smp-backend

# Server Configuration
server.port=8080

# PostgreSQL Database Connection (supports dynamic environment variables with localhost fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smp_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Observability & High-Readability Console Logging
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%X{traceId:-STARTUP}]){cyan} %clr(%-5level) %clr([%15.15t]){faint} %clr(%-32.32logger{30}){yellow} : %m%n%wEx
logging.level.root=INFO
logging.level.com.smp=INFO
logging.level.org.springframework.web=INFO