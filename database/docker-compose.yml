services:
  postgres:
    image: postgres:17-alpine
    container_name: smp-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - smp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smp_pgdata:
    driver: local

