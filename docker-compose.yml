services:
  # ============================================================================
  # 1. PostgreSQL Database Service
  # ============================================================================
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: smp-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - smp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smp_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - smp-network

  # ============================================================================
  # 2. Spring Boot Backend REST Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smp-backend-service
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/smp_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - smp-network

  # ============================================================================
  # 3. Angular Frontend Web UI (Nginx Alpine)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smp-frontend-ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - smp-network

# ==============================================================================
# Networks & Persistent Volumes
# ==============================================================================
networks:
  smp-network:
    driver: bridge

volumes:
  smp_pgdata:
    driver: local
